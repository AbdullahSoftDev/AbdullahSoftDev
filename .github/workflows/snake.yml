name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"  # Runs every 12 hours at 00:00 and 12:00 UTC
  workflow_dispatch:  # Allows manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: AbdullahSoftDev
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=CCFF00&color_dots=39FF14,CCFF00,DFFF00,FAFAD2
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=CCFF00&color_dots=39FF14,CCFF00,DFFF00,FAFAD2

      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update snake animation [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
