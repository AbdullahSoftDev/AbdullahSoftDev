name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: AbdullahSoftDev
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=%23CCFF00&color_dots=%230D1117,%2339FF14,%23CCFF00,%23DFFF00,%23FAFAD2

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
